name: APK do Forja
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: co
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Preparar
        id: prep
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee build.log
          set -o pipefail
          { npm ci && npx cap sync android; } 2>&1 | tee -a build.log
      - name: Compilar o APK
        id: gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log
      - name: Publicar o APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Forja.apk
          gh release delete forja-android -y --cleanup-tag || true
          gh release create forja-android Forja.apk --target android \
            --title "Forja para Android 1.${{ github.run_number }}" \
            --notes "Baixe o Forja.apk no celular e instale. Versões novas instalam por cima, sem perder os dados."
      - name: Guardar o registro da compilação
        if: always()
        run: |
          echo "resultado: ${{ job.status }} · execução ${{ github.run_number }} · $(date -u)" > status.txt
          echo "checkout=${{ steps.co.outcome }} java=${{ steps.java.outcome }} node=${{ steps.node.outcome }} preparar=${{ steps.prep.outcome }} gradle=${{ steps.gradle.outcome }}" >> status.txt
          tail -c 80000 build.log > registro.log 2>/dev/null || echo "sem build.log" > registro.log
          git config user.name "forja-bot"
          git config user.email "forja-bot@users.noreply.github.com"
          git checkout --orphan android-log
          git rm -rf --cached . > /dev/null
          git add -f status.txt registro.log
          git commit -m "registro ${{ github.run_number }}"
          git push -f origin android-log
